</head>
<body class="tool-page">
<a class="skip-link" href="#main-content">跳至主要內容</a>
    <header class="site-header"><nav class="site-nav" aria-label="主要導覽">
        <a class="brand" href="../../index.html"><span class="brand-mark"><svg aria-hidden="true"><use href="../../assets/icons.svg#toolbox"></use></svg></span>萬能工具箱<span class="brand-en">TOOLBOX</span></a>
        <a class="back-link" href="../../index.html#all-tools"><svg aria-hidden="true"><use href="../../assets/icons.svg#arrow-left"></use></svg>所有工具</a>
    </nav></header>
    <div class="tool-intro">
        <nav class="breadcrumb" aria-label="麵包屑"><a href="../../index.html">首頁</a><span aria-hidden="true">/</span><span>生活小幫手</span><span aria-hidden="true">/</span><span aria-current="page">隨機輪盤</span></nav>
        <div class="tool-title-row"><span class="tool-icon rose"><svg aria-hidden="true"><use href="../../assets/icons.svg#roulette"></use></svg></span><div><h1>隨機輪盤</h1><p class="tool-subtitle">午餐吃什麼？下一站去哪裡？輸入選項，讓輪盤幫你做決定。</p></div></div>
    </div>
    <main id="main-content" class="tool-main roulette-container">
        <div class="roulette-wrapper">
            <canvas id="roulette-canvas" width="500" height="500"></canvas>
            <button id="spin-btn">開始</button>
        </div>
        <div class="options-wrapper">
            <h2>選項</h2>
            <textarea id="options-input" aria-label="輪盤選項，每行一個" placeholder="每個選項一行">午餐&#10;晚餐&#10;火鍋&#10;牛排&#10;拉麵&#10;隨便</textarea>
            <p class="note">修改選項後輪盤會自動更新</p>
        </div>
    </main>
    <footer class="site-footer"><div><a class="footer-brand" href="../../index.html">萬能工具箱</a><span>讓每一天，更輕鬆一點。</span></div><a class="back-link" href="../../index.html#all-tools">探索更多工具 <svg aria-hidden="true"><use href="../../assets/icons.svg#arrow-right"></use></svg></a></footer>
    <script src="script.js"></script>

</html>
