<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代碼測試 — 萬能工具箱</title>
    <meta name="theme-color" content="#f7f8f4">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <link rel="stylesheet" href="../../site.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="tool-page">
<a class="skip-link" href="#main-content">跳至主要內容</a>
    <header class="site-header"><nav class="site-nav" aria-label="主要導覽">
        <a class="brand" href="../../index.html"><span class="brand-mark"><svg aria-hidden="true"><use href="../../assets/icons.svg#toolbox"></use></svg></span>萬能工具箱<span class="brand-en">TOOLBOX</span></a>
        <a class="back-link" href="../../index.html#all-tools"><svg aria-hidden="true"><use href="../../assets/icons.svg#arrow-left"></use></svg>所有工具</a>
    </nav></header>
    <div class="tool-intro">
        <nav class="breadcrumb" aria-label="麵包屑"><a href="../../index.html">首頁</a><span aria-hidden="true">/</span><span>開發工具</span><span aria-hidden="true">/</span><span aria-current="page">代碼測試</span></nav>
        <div class="tool-title-row"><span class="tool-icon blue"><svg aria-hidden="true"><use href="../../assets/icons.svg#code"></use></svg></span><div><h1>代碼測試</h1><p class="tool-subtitle">隨手測試 HTML、CSS 與 JavaScript，讓靈感快速變成畫面。</p></div></div>
    </div>
    <main id="main-content" class="tool-main">
        <div class="editor-container">
            <div class="editor">
                <label for="html-code">HTML</label>
                <textarea id="html-code" placeholder="在這裡輸入 HTML"></textarea>
            </div>
            <div class="editor">
                <label for="css-code">CSS</label>
                <textarea id="css-code" placeholder="在這裡輸入 CSS"></textarea>
            </div>
            <div class="editor">
                <label for="js-code">JavaScript</label>
                <textarea id="js-code" placeholder="在這裡輸入 JavaScript"></textarea>
            </div>
        </div>
        <button id="run-btn" class="button primary">開啟測試結果 ↗</button>
    </main>
    <footer class="site-footer"><div><a class="footer-brand" href="../../index.html">萬能工具箱</a><span>讓每一天，更輕鬆一點。</span></div><a class="back-link" href="../../index.html#all-tools">探索更多工具 <svg aria-hidden="true"><use href="../../assets/icons.svg#arrow-right"></use></svg></a></footer>
    <script src="script.js"></script>
</body>
</html>
