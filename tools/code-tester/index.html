<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代碼測試工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>代碼測試工具</h1>
    </header>
    <main>
        <div class="editor-container">
            <div class="editor">
                <label for="html-code">HTML</label>
                <textarea id="html-code" placeholder="在這裡輸入 HTML"></textarea>
            </div>
            <div class="editor">
                <label for="css-code">CSS</label>
                <textarea id="css-code" placeholder="在這裡輸入 CSS"></textarea>
            </div>
            <div class="editor">
                <label for="js-code">JavaScript</label>
                <textarea id="js-code" placeholder="在這裡輸入 JavaScript"></textarea>
            </div>
        </div>
        <button id="run-btn">測試</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
