<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免費圖片拉伸／壓扁工具。獨立調整圖片寬高、百分比與像素，即時預覽並下載 PNG、JPG 或 WebP，全程在瀏覽器內處理。">
    <meta name="theme-color" content="#f7f8f4">
    <title>圖片拉伸／壓扁工具 — 萬能工具箱</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <link rel="stylesheet" href="../../site.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="tool-page">
    <a class="skip-link" href="#main-content">跳至主要內容</a>
    <header class="site-header"><nav class="site-nav" aria-label="主要導覽">
        <a class="brand" href="../../index.html"><span class="brand-mark"><svg aria-hidden="true"><use href="../../assets/icons.svg#toolbox"></use></svg></span>萬能工具箱</a>
        <a class="back-link" href="../../index.html#all-tools"><svg aria-hidden="true"><use href="../../assets/icons.svg#arrow-left"></use></svg>所有工具</a>
    </nav></header>
    <div class="tool-intro">
        <div class="tool-title-row"><span class="tool-icon green"><svg aria-hidden="true"><use href="../../assets/icons.svg#stretch"></use></svg></span><div><h1>圖片拉伸／壓扁</h1></div></div>
    </div>
    <main id="main-content" class="tool-main">
        <div class="privacy-note"><svg aria-hidden="true"><use href="../../assets/icons.svg#shield"></use></svg>圖片僅在本機處理。</div>
        <div class="image-workspace">
            <section class="preview-panel panel" aria-labelledby="preview-title">
                <div class="workspace-toolbar"><h2 id="preview-title"><svg aria-hidden="true"><use href="../../assets/icons.svg#image"></use></svg>預覽</h2><button id="change-file" class="text-button" hidden><svg aria-hidden="true"><use href="../../assets/icons.svg#upload"></use></svg>更換圖片</button></div>
                <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
                <div id="drop-zone" class="drop-zone">
                    <div class="upload-illustration" aria-hidden="true"><div class="paper-back"></div><div class="paper-front"><svg aria-hidden="true"><use href="../../assets/icons.svg#image"></use></svg><span class="upload-plus">＋</span></div></div>
                    <h3>拖放或貼上圖片</h3>
                    <button id="choose-file" class="button primary"><svg aria-hidden="true"><use href="../../assets/icons.svg#upload"></use></svg>選擇圖片</button>
                    <span class="file-types">PNG、JPG、WebP、GIF、BMP · 最大 50 MB</span>
                    <div class="sample-action"><button id="load-sample" class="text-button">使用範例圖片 <svg aria-hidden="true"><use href="../../assets/icons.svg#arrow-up-right"></use></svg></button></div>
                </div>
                <div id="loaded-preview" hidden>
                    <div class="preview-controls"><div class="view-toggle" role="group" aria-label="預覽模式"><button id="view-result" aria-pressed="true" class="selected">調整後</button><button id="view-original" aria-pressed="false">原圖</button></div><span id="preview-dimensions"></span></div>
                    <div class="canvas-stage"><canvas id="preview-canvas" role="img" aria-label="圖片調整預覽"></canvas></div>
                    <div class="file-info"><span id="file-name"></span><span id="file-size"></span></div>
                </div>
                <p id="preview-help" class="preview-help" hidden></p>
            </section>
            <aside class="settings-panel panel" aria-labelledby="settings-title">
                <div class="workspace-toolbar"><h2 id="settings-title"><svg aria-hidden="true"><use href="../../assets/icons.svg#sliders"></use></svg>調整設定</h2><button id="reset-image" class="text-button" disabled><svg aria-hidden="true"><use href="../../assets/icons.svg#reset"></use></svg>重設</button></div>
                <fieldset id="image-settings" disabled>
                    <legend class="sr-only">圖片尺寸與輸出設定</legend>
                    <div class="settings-section">
                        <div class="section-label"><h3>圖片尺寸</h3></div>
                        <div class="dimension-fields">
                            <label for="width-input">寬度<span class="number-field"><input id="width-input" type="number" min="1" max="8192" step="1" value="800" inputmode="numeric" aria-describedby="dimension-help dimension-error"><span>px</span></span></label>
                            <span class="dimension-times" aria-hidden="true">×</span>
                            <label for="height-input">高度<span class="number-field"><input id="height-input" type="number" min="1" max="8192" step="1" value="600" inputmode="numeric" aria-describedby="dimension-help dimension-error"><span>px</span></span></label>
                        </div>
                        <label class="lock-option"><input type="checkbox" id="lock-ratio"><svg aria-hidden="true"><use href="../../assets/icons.svg#link"></use></svg>鎖定原始比例</label>
                        <div class="slider-field"><label for="width-scale">水平縮放 <output id="width-percent" for="width-scale">100%</output></label><input id="width-scale" type="range" min="10" max="300" value="100" step="1"></div>
                        <div class="slider-field"><label for="height-scale">垂直縮放 <output id="height-percent" for="height-scale">100%</output></label><input id="height-scale" type="range" min="10" max="300" value="100" step="1"></div>
                        <details class="size-details"><summary>尺寸限制</summary><p id="dimension-help" class="limit-note">每邊 1–8,192 px，最多 2,400 萬像素。</p></details>
                        <p id="dimension-error" class="inline-error" role="alert" hidden></p>
                    </div>
                    <div class="settings-section">
                        <div class="section-label"><h3>快速變換</h3></div>
                        <div class="preset-grid"><button type="button" data-width="1.5" data-height="1">拉寬 <span>150%</span></button><button type="button" data-width="1" data-height="1.5">拉長 <span>150%</span></button><button type="button" data-width="0.5" data-height="1">壓窄 <span>50%</span></button><button type="button" data-width="1" data-height="0.5">壓扁 <span>50%</span></button></div>
                    </div>
                    <div class="settings-section export-settings">
                        <div class="section-label"><h3>匯出圖片</h3></div>
                        <label class="format-field" for="export-format">檔案格式<select id="export-format"><option value="image/png">PNG（透明背景）</option><option value="image/jpeg">JPG（白色背景）</option><option value="image/webp">WebP（透明背景）</option></select></label>
                        <div id="quality-field" class="slider-field" hidden><label for="export-quality">圖片品質 <output id="quality-value" for="export-quality">92%</output></label><input id="export-quality" type="range" min="10" max="100" value="92"></div>
                        <label class="smoothing-option"><input type="checkbox" id="image-smoothing" checked>平滑縮放</label>
                    </div>
                </fieldset>
                <div class="download-area"><div class="export-summary"><span>輸出尺寸</span><strong id="output-size">尚未選擇圖片</strong></div><button id="download-image" class="button primary" disabled><svg aria-hidden="true"><use href="../../assets/icons.svg#download"></use></svg>下載圖片</button></div>
            </aside>
        </div>
        <p id="image-status" class="image-status" role="status" aria-live="polite"></p>
        <p class="image-footnote">GIF 僅匯出靜態畫面。</p>
        <noscript><p>請啟用 JavaScript，以使用圖片預覽與下載功能。</p></noscript>
    </main>
    <footer class="site-footer"><div><a class="footer-brand" href="../../index.html">萬能工具箱</a></div><a class="back-link" href="../../index.html#all-tools">所有工具 <svg aria-hidden="true"><use href="../../assets/icons.svg#arrow-right"></use></svg></a></footer>
    <script src="script.js" defer></script>
</body>
</html>
