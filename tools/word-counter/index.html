<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字數計算 — 萬能工具箱</title>
    <meta name="theme-color" content="#f7f8f4">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <link rel="stylesheet" href="../../site.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="tool-page">
<a class="skip-link" href="#main-content">跳至主要內容</a>
    <header class="site-header"><nav class="site-nav" aria-label="主要導覽">
        <a class="brand" href="../../index.html"><span class="brand-mark"><svg aria-hidden="true"><use href="../../assets/icons.svg#toolbox"></use></svg></span>萬能工具箱<span class="brand-en">TOOLBOX</span></a>
        <a class="back-link" href="../../index.html#all-tools"><svg aria-hidden="true"><use href="../../assets/icons.svg#arrow-left"></use></svg>所有工具</a>
    </nav></header>
    <div class="tool-intro">
        <nav class="breadcrumb" aria-label="麵包屑"><a href="../../index.html">首頁</a><span aria-hidden="true">/</span><span>文字與編輯</span><span aria-hidden="true">/</span><span aria-current="page">字數計算</span></nav>
        <div class="tool-title-row"><span class="tool-icon peach"><svg aria-hidden="true"><use href="../../assets/icons.svg#text"></use></svg></span><div><h1>字數計算</h1><p class="tool-subtitle">中英文字數、標點符號與行數，貼上文字，詳細統計一目瞭然。</p></div></div>
    </div>
    <main id="main-content" class="tool-main">
        <div class="counter-container"><label class="field-label" for="text-input">貼上文字，統計即刻開始</label>
            <textarea id="text-input" aria-label="輸入要統計的文字" placeholder="在這裡貼上或輸入您的文字..."></textarea>
            <div id="stats-grid">
                <div class="stat-item">
                    <span class="label">總字數：</span>
                    <span id="total-chars">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">數字：</span>
                    <span id="numbers">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">行列（段落）數：</span>
                    <span id="paragraphs">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">中文字數：</span>
                    <span id="chinese-chars">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">中文標點符號數：</span>
                    <span id="chinese-puncs">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">英文字數：</span>
                    <span id="english-chars">0</span>
                </div>
                 <div class="stat-item">
                    <span class="label">英文標點符號數：</span>
                    <span id="english-puncs">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">英文單詞數：</span>
                    <span id="english-words">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">字節數 (Bytes)：</span>
                    <span id="bytes">0</span>
                </div>
            </div>
        </div>
    </main>
    <footer class="site-footer"><div><a class="footer-brand" href="../../index.html">萬能工具箱</a><span>讓每一天，更輕鬆一點。</span></div><a class="back-link" href="../../index.html#all-tools">探索更多工具 <svg aria-hidden="true"><use href="../../assets/icons.svg#arrow-right"></use></svg></a></footer>
    <script src="script.js"></script>
</body>
</html>
