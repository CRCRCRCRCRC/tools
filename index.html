<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萬能工具箱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>萬能工具箱</h1>
        <p>一個集合各種實用工具的網站</p>
    </header>
    <main>
        <section id="tools-grid">
            <a href="tools/code-tester/index.html" class="tool-card">
                <h2>代碼測試</h2>
                <p>即時測試您的 HTML, CSS, 和 JavaScript 代碼片段。</p>
            </a>
            <a href="tools/word-counter/index.html" class="tool-card">
                <h2>字數計算</h2>
                <p>計算文字的總字數、中英文字數、標點符號、行數等詳細資訊。</p>
            </a>
            <a href="tools/markdown-editor/index.html" class="tool-card">
                <h2>Markdown 編輯器</h2>
                <p>即時預覽 Markdown 語法，輕鬆撰寫格式化文件。</p>
            </a>
            <a href="tools/password-generator/index.html" class="tool-card">
                <h2>隨機密碼產生器</h2>
                <p>產生高強度的隨機密碼，可自訂長度和字元類型。</p>
            </a>
            <a href="tools/qr-code-tool/index.html" class="tool-card">
                <h2>QR Code 工具</h2>
                <p>輕鬆產生、下載 QR Code，並支援上傳或貼上圖片進行辨識。</p>
            </a>
            <a href="tools/random-roulette/index.html" class="tool-card">
                <h2>隨機輪盤</h2>
                <p>遇到選擇困難？輸入您的選項，讓命運來決定吧！</p>
            </a>
            <!-- 未來可以新增更多工具卡片 -->
            <!-- 
            <a href="tools/another-tool/index.html" class="tool-card">
                <h2>另一個工具</h2>
                <p>這個工具的簡短描述。</p>
            </a>
            -->
        </section>
    </main>
    <footer>
        <p>&copy; 2024 萬能工具箱. All Rights Reserved.</p>
    </footer>
    <script src="script.js" defer></script>
</body>
</html>
